name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:bullseye

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          tar -C target/release \
            -czf dist/kctx-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz \
            kctx

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

release:
  needs: build
  runs-on: ubuntu-latest

  steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          dist/* \
          --generate-notes \
          --repo "${GITHUB_REPOSITORY}"

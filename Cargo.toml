[package]
name = "kctx"
version = "0.1.0"
edition = "2024"

[dependencies]
# Kubernetes client: kubeconfig parsing/merging, TLS, exec credential plugins, typed API.
# Default features give us `client` + `rustls-tls` + `ring` (no OpenSSL).
kube = "4.2"
# Typed resources we read. v1_34 rather than `latest` for broader server compatibility.
k8s-openapi = { version = "0.28", features = ["v1_34"] }
tokio = { version = "1.53", features = ["rt", "macros", "time", "sync", "net"] }
# `crossterm` comes in as a default feature of ratatui and is re-exported as `ratatui::crossterm`.
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
